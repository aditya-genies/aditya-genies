.draw { stroke-dasharray: 1; animation: draw 1.4s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
@media (prefers-reduced-motion: reduce) { .in, .grow, .pop, .draw { animation: none; } }
